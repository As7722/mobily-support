# ══════════════════════════════════════════════════════════════════════════════
#  Mobily Technical Support — Nginx Configuration
#  Reverse proxy to FastAPI + static file serving + SSL termination (Certbot)
# ══════════════════════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ── MIME & Charset ────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75;
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml image/svg+xml;

    # ── Rate Limiting Zones ───────────────────────────────────────────────────
    # General: 30 req/s per IP
    limit_req_zone $binary_remote_addr zone=general:20m rate=30r/s;
    # API: 10 req/s per IP
    limit_req_zone $binary_remote_addr zone=api:10m    rate=10r/s;
    # Auth: 5 req/s per IP (brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth:5m    rate=5r/s;
    # Portal submit: 5 req/min per IP
    limit_req_zone $binary_remote_addr zone=portal:5m  rate=5r/m;
    # Webhooks: 50 req/s (Twilio can send many fast)
    limit_req_zone $binary_remote_addr zone=webhooks:5m rate=50r/s;

    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # ── Upstream: FastAPI ─────────────────────────────────────────────────────
    upstream fastapi {
        server web:8000;
        keepalive 64;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge (Certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name support.mobily.com;   # replace with actual domain

        # ── SSL Certificates (Certbot / Let's Encrypt) ────────────────────────
        ssl_certificate     /etc/letsencrypt/live/support.mobily.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/support.mobily.com/privkey.pem;
        ssl_dhparam         /etc/nginx/ssl/dhparam.pem;

        # ── SSL Hardening ─────────────────────────────────────────────────────
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache         shared:SSL:50m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;
        ssl_stapling              on;
        ssl_stapling_verify       on;

        # ── Security Headers ──────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; "
            "script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://fonts.googleapis.com; "
            "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; "
            "font-src 'self' https://fonts.gstatic.com; "
            "img-src 'self' data: blob: https:; "
            "connect-src 'self' wss: https:; "
            "frame-ancestors 'none';"
            always;

        # ── Client limits ─────────────────────────────────────────────────────
        client_max_body_size   25M;
        client_body_timeout    30s;
        client_header_timeout  10s;
        send_timeout           30s;
        proxy_read_timeout     120s;

        # ── Static files (served directly by Nginx) ───────────────────────────
        location /static/ {
            alias /app/app/static/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
            gzip_static on;
        }

        # ── Auth endpoints (strict rate limit) ────────────────────────────────
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            limit_conn perip 20;
            include /etc/nginx/proxy_params;
            proxy_pass http://fastapi;
        }

        # ── Ticket submit (portal rate limit) ────────────────────────────────
        location /api/tickets/submit {
            limit_req zone=portal burst=3 nodelay;
            include /etc/nginx/proxy_params;
            proxy_pass http://fastapi;
        }

        # ── Webhooks (Twilio) — higher rate limit ─────────────────────────────
        location /webhooks/ {
            limit_req zone=webhooks burst=100 nodelay;
            include /etc/nginx/proxy_params;
            proxy_pass http://fastapi;
        }

        # ── SSE endpoints — disable buffering + long timeout ──────────────────
        location ~ ^/api/sse/ {
            proxy_pass          http://fastapi;
            proxy_http_version  1.1;
            proxy_set_header    Connection "";
            proxy_set_header    X-Accel-Buffering no;
            proxy_buffering     off;
            proxy_cache         off;
            proxy_read_timeout  3600s;
            chunked_transfer_encoding on;
        }

        # ── API endpoints ─────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            include /etc/nginx/proxy_params;
            proxy_pass http://fastapi;
        }

        # ── All other requests ────────────────────────────────────────────────
        location / {
            limit_req zone=general burst=60 nodelay;
            include /etc/nginx/proxy_params;
            proxy_pass http://fastapi;
        }

        # ── Custom error pages ────────────────────────────────────────────────
        error_page 429 /429.html;
        error_page 502 503 504 /50x.html;

        location = /429.html {
            root /usr/share/nginx/html;
            internal;
        }
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
