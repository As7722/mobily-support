# Alembic Configuration — Mobily Tech Support System
# Do NOT put secrets here. The actual DATABASE_URL is injected by alembic/env.py
# reading from pydantic-settings / .env

[alembic]
# Path to migration scripts
script_location = alembic

# Template for new revision files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = Asia/Riyadh

# Set to 'true' to run in transaction isolation
truncate_slug_length = 40

# Path to the alembic/versions directory
version_locations = %(here)s/alembic/versions

# Logging configuration — redirected to Python logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
